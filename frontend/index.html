<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DataFlow | Intelligent Dashboard Generator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="background-mesh">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
    </div>

    <main class="app-container" id="app-container">
      <header class="app-header">
        <div class="logo-wrapper">
          <svg
            class="logo-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M17.5 12a1 1 0 1 1 0 9H9.006a7 7 0 1 1 6.702-9z" />
            <path d="M21.832 9A3 3 0 0 0 19 7h-2.207a5.5 5.5 0 0 0-10.72.61" />
          </svg>
        </div>
        <div class="header-text">
          <h1>DataFlow</h1>
          <p>Transform raw CSV/JSON into actionable insights</p>
        </div>
      </header>

      <div class="glass-panel">
        <section id="view-upload" class="view-section active">
          <div class="drop-zone" id="drop-zone" role="button" tabindex="0">
            <input type="file" id="file-input" accept=".csv, .json" hidden />

            <div class="icon-circle">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="17 8 12 3 7 8" />
                <line x1="12" y1="3" x2="12" y2="15" />
              </svg>
            </div>

            <h3>Upload Data File</h3>
            <p class="hint">Drag & drop or click to browse</p>

            <div class="tags-row">
              <span class="tag">CSV</span>
              <span class="tag">JSON</span>
              <span class="tag warning">Max 20MB</span>
            </div>
          </div>
        </section>

        <section id="view-progress" class="view-section hidden">
          <div class="progress-wrapper">
            <div class="loader-spinner"></div>
            <h3 class="animate-pulse">Processing Data...</h3>

            <div class="progress-meta">
              <span id="filename-display">data.csv</span>
              <span id="percent-display">0%</span>
            </div>

            <div class="progress-track">
              <div class="progress-fill" id="progress-fill"></div>
            </div>

            <p class="status-detail">Analyzing schema and generating charts</p>
          </div>
        </section>

        <section id="view-error" class="view-section hidden">
          <div class="error-state">
            <div class="error-icon-box">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
              </svg>
            </div>
            <h3>Upload Failed</h3>
            <p id="error-message">Something went wrong.</p>
            <button class="btn btn-secondary" id="retry-btn">Try Again</button>
          </div>
        </section>

        <section id="view-dashboard" class="view-section hidden">
          <div class="dashboard-header">
            <div class="success-pill">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <polyline points="20 6 9 17 4 12" />
              </svg>
              <span>Ready</span>
            </div>
            <button class="btn-icon" id="reset-btn" title="Start Over">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                <path d="M21 3v5h-5" />
                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
                <path d="M8 16H3v5" />
              </svg>
            </button>
          </div>

          <div class="dashboard-grid" id="iframe-container"></div>
        </section>
      </div>
    </main>

    <script type="module" src="script.js"></script>
  </body>
</html>
