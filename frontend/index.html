<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Insight Uploader</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
  </head>
  <body>
    <div class="background-mesh"></div>

    <main class="app-container">
      <header class="app-header">
        <div class="logo-mark">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="white"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-cloudy-icon lucide-cloudy">
            <path d="M17.5 12a1 1 0 1 1 0 9H9.006a7 7 0 1 1 6.702-9z" />
            <path d="M21.832 9A3 3 0 0 0 19 7h-2.207a5.5 5.5 0 0 0-10.72.61" />
          </svg>
        </div>
        <h1>DataFlow</h1>
        <p>Securely process your CSV or JSON files instantly.</p>
      </header>

      <div class="glass-panel">
        <div id="upload-view">
          <div class="drop-zone" id="drop-zone">
            <input type="file" id="file-input" accept=".csv, .json" hidden />

            <div class="icon-circle">
              <svg
                width="32"
                height="32"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="17 8 12 3 7 8" />
                <line x1="12" y1="3" x2="12" y2="15" />
              </svg>
            </div>

            <h3>Upload Data File</h3>
            <p class="hint">Drag & drop or click to browse</p>
            <div class="tags">
              <span class="tag">CSV</span>
              <span class="tag">JSON</span>
              <span class="tag">Max 20MB</span>
            </div>
          </div>
        </div>

        <div id="progress-view" class="hidden">
          <div class="progress-container">
            <div class="file-info">
              <span id="uploading-filename">data.csv</span>
              <span id="upload-percent">0%</span>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
            <p class="status-text">Uploading and generating report...</p>
          </div>
        </div>

        <div id="error-view" class="hidden">
          <div class="error-box">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10" />
              <line x1="12" y1="8" x2="12" y2="12" />
              <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
            <span id="error-text">Error message goes here.</span>
          </div>
          <button class="btn-text" id="try-again-btn">Try Again</button>
        </div>

        <div id="report-view" class="hidden">
          <div class="report-header">
            <div class="success-badge">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <polyline points="20 6 9 17 4 12" />
              </svg>
              Analysis Complete
            </div>
            <button class="btn-icon" id="reset-btn" title="Upload New File">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-upload-icon lucide-upload">
                <path d="M12 3v12" />
                <path d="m17 8-5-5-5 5" />
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              </svg>
            </button>
          </div>

          <div class="metrics-grid" id="metrics-container"></div>

          <div class="insights-box">
            <h4>Key Insights</h4>
            <ul id="insights-list"></ul>
          </div>

          <button class="btn-primary full-width">Download Full Report</button>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
